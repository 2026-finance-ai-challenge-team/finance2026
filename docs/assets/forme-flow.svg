<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="320" viewBox="0 0 1440 320" fill="none" role="img" aria-labelledby="title description">
  <title id="title">From your files to your next step</title>
  <desc id="description">업무 선택, 서류 인식, 요건 대조, 준비 안내. 네 단계를 거쳐 파일이 다음 행동으로 연결됩니다.</desc>
  <style>
    .bg{fill:#F1F5FE}.ink{fill:#102B53}.muted{fill:#4B6283}.line{stroke:#BCD0F2}.icon{stroke:#245BEB}.paper{fill:white;stroke:#C3D3EF}
