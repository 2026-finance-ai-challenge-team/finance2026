    <text x="180" y="206">업무를 고르면</text><text x="539" y="206">서류를 읽고</text><text x="899" y="206">조건을 맞춰</text><text x="1258" y="206">다음을 안내</text>
  </g>
  <g class="muted" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif" font-size="21" text-anchor="middle">
    <text x="180" y="247">은행 · 목적 · 방문 조건</text><text x="539" y="247">문서명 · 날짜 · 명의</text><text x="899" y="247">누락 · 기한 · 일치 여부</text><text x="1258" y="247">발급 경로 · 준비 체크리스트</text>
