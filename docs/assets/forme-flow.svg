  </style>
  <rect class="bg" width="1440" height="320" rx="22"/>
  <path class="line" d="M260 107h151m-9-8 9 8-9 8m205-8h151m-9-8 9 8-9 8m205-8h151m-9-8 9 8-9 8" stroke-width="2"/>
