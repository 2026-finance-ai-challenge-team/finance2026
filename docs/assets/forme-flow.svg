    <rect class="paper" width="66" height="85" rx="11"/>
    <path class="icon" d="M18 23h30M18 39h18M18 55h25"/>
    <circle cx="62" cy="76" r="20" fill="#245BEB"/>
    <path d="m54 76 6 6 10-13" stroke="white"/>
  </g>
  <g transform="translate(505 61)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect class="paper" width="66" height="85" rx="11"/>
    <path class="icon" d="M18 23h30M18 39h18M18 55h25M-9 15V0h15m51 0h18v15M-9 69v16H6m51 0h18V69"/>
    <path d="M-17 45h100" stroke="#FF784A" stroke-width="4"/>
  </g>
  <g transform="translate(864 65)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
