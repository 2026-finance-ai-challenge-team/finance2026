[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofbridge-api"
version = "0.1.0"
description = "FastAPI orchestration layer for the ProofBridge MVP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "openai>=2,<3",
    "pypdf>=6,<7",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.9,<1",
    "python-dotenv>=1,<2",
    "requests>=2.31,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
